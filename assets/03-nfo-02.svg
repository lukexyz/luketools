<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 420' role='img' aria-labelledby='n-title n-desc'><title id='n-title'>luketools — shaded NFO tool index</title><desc id='n-desc'>An original monochrome NFO composition with a tall, slanted, wedge-cut luketools wordmark. Solid letter bodies dissolve through three cell-dither densities into small debris. Shaded side walls and connecting rails lead into a double-framed index containing the five supplied languages, PowerShell Profile, Notes, Jupyter Pro and the main branch. A paper-and-terminal emblem represents the personal development toolkit. Slow debris drift is illustrative.</desc><style>.n-debris{opacity:.65;animation:n-drift 14s steps(3,end) infinite}.n-debris.n-late{animation-delay:-7s}@keyframes n-drift{0%,100%{transform:translate(0,0);opacity:.65}50%{transform:translate(0,4px);opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><defs><pattern id='n-dense' width='8' height='8' patternUnits='userSpaceOnUse'><path d='M0 0H8V4H0Z M0 4H4V8H0Z' fill='#e5e9d9'/></pattern><pattern id='n-medium' width='8' height='8' patternUnits='userSpaceOnUse'><path d='M0 0H4V4H0Z M4 4H8V8H4Z' fill='#e5e9d9'/></pattern><pattern id='n-light' width='8' height='8' patternUnits='userSpaceOnUse'><rect width='4' height='4' fill='#e5e9d9'/></pattern><path id='n-l' d='M8 0H30V102H72L64 126H0V8Z'/><path id='n-u' d='M0 8L8 0H26V100H48V0H72V108L54 126H18L0 108Z'/><path id='n-k' d='M0 8L8 0H26V48L48 0H72L40 62L74 126H46L26 84V126H0Z'/><path id='n-e' d='M8 0H72L66 24H26V50H62L56 74H26V102H72L64 126H0V8Z'/><path id='n-t' d='M8 0H76L68 24H50V126H24V24H0Z'/><path id='n-o' fill-rule='evenodd' d='M18 0H54L72 18V108L54 126H18L0 108V18Z M26 24V102H46V24Z'/><path id='n-s' d='M18 0H72L66 24H26V50H54L72 68V108L54 126H0L6 102H46V76H18L0 58V18Z'/><g id='n-word' transform='translate(122 66) skewX(-10)'><use href='#n-l'/><use href='#n-u' x='84'/><use href='#n-k' x='168'/><use href='#n-e' x='252'/